<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Week 3 - Day 2: Loops and Functions</title>
    <link rel="stylesheet" href="../assets/css/bootstrap.min.css" />
  </head>
  <body class="bg-light">
    <div class="container py-5">
      <h1 class="mb-4">Day 2: Loops and Functions</h1>
      <p class="lead">Practice loops, function declarations, arrow functions, scope, and callbacks.</p>

      <section class="mb-4">
        <h2>Topics</h2>
        <ul>
          <li>Loops: <code>for</code>, <code>while</code>, <code>for...of</code></li>
          <li>Functions and arrow functions</li>
          <li>Scope: global and block scope</li>
          <li>Callbacks</li>
        </ul>
      </section>

      <section class="card shadow-sm mb-4">
        <div class="card-body">
          <h3>Example code</h3>
          <pre class="bg-dark text-white p-3 rounded"><code id="codeExample2"></code></pre>
        </div>
      </section>

      <section class="card shadow-sm mb-4">
        <div class="card-body">
          <h3>Run demo</h3>
          <button id="runDay2" class="btn btn-primary">Run demo</button>
          <div id="outputDay2" class="mt-3 p-3 bg-white border rounded"></div>
        </div>
      </section>
    </div>

    <script src="../assets/js/jquery.min.js"></script>
    <script src="../assets/js/bootstrap.bundle.min.js"></script>
    <script>
      const codeExample2 = `// Loop examples
const numbers = [1, 2, 3, 4, 5];

for (let i = 0; i < numbers.length; i++) {
  console.log('for loop:', numbers[i]);
}

let count = 0;
while (count < 3) {
  console.log('while loop:', count);
  count++;
}

for (const number of numbers) {
  console.log('for...of loop:', number);
}

// Functions and callbacks
function greet(name) {
  return `Hello, ${name}`;
}

const sayHello = (name) => `${name} says hi`;

function repeatAction(times, action) {
  for (let i = 0; i < times; i++) {
    console.log(action(i));
  }
}

repeatAction(3, (index) => `Action ${index + 1}`);
`;
      document.getElementById('codeExample2').textContent = codeExample2;

      document.getElementById('runDay2').addEventListener('click', function () {
        const output = [];
        const numbers = [1, 2, 3, 4, 5];

        for (let i = 0; i < numbers.length; i++) {
          output.push(`for loop: ${numbers[i]}`);
        }

        let count = 0;
        while (count < 3) {
          output.push(`while loop: ${count}`);
          count++;
        }

        for (const number of numbers) {
          output.push(`for...of loop: ${number}`);
        }

        function greet(name) {
          return `Hello, ${name}`;
        }

        const sayHello = (name) => `${name} says hi`;

        function repeatAction(times, action) {
          for (let i = 0; i < times; i++) {
            output.push(action(i));
          }
        }

        output.push(greet('Sana'));
        output.push(sayHello('Adeel'));
        repeatAction(3, (index) => `Action ${index + 1}`);

        document.getElementById('outputDay2').textContent = output.join('\n');
      });
    </script>
  </body>
</html>
