<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Week 3 - Day 5: Async JavaScript</title>
    <link rel="stylesheet" href="../assets/css/bootstrap.min.css" />
  </head>
  <body class="bg-light">
    <div class="container py-5">
      <h1 class="mb-4">Day 5: Async JavaScript</h1>
      <p class="lead">Practice Promises, async/await, fetch API, and LocalStorage.</p>

      <section class="mb-4">
        <h2>Topics</h2>
        <ul>
          <li>Promises</li>
          <li><code>async</code>/<code>await</code></li>
          <li><code>fetch</code> API</li>
          <li>LocalStorage</li>
        </ul>
      </section>

      <section class="card shadow-sm mb-4">
        <div class="card-body">
          <h3>API fetch demo</h3>
          <p class="text-muted">Fetch a sample user and display the result.</p>
          <button id="fetchUser" class="btn btn-primary">Fetch user</button>
          <div id="fetchResult" class="mt-3 p-3 bg-white border rounded"></div>
        </div>
      </section>

      <section class="card shadow-sm mb-4">
        <div class="card-body">
          <h3>LocalStorage demo</h3>
          <p class="text-muted">Store and retrieve a simple value from LocalStorage.</p>
          <div class="mb-3">
            <input id="storageKey" class="form-control mb-2" type="text" placeholder="Storage key" value="favoriteLanguage">
            <input id="storageValue" class="form-control mb-2" type="text" placeholder="Storage value" value="JavaScript">
            <button id="saveStorage" class="btn btn-success me-2">Save</button>
            <button id="loadStorage" class="btn btn-secondary">Load</button>
          </div>
          <div id="storageOutput" class="mt-3 p-3 bg-white border rounded"></div>
        </div>
      </section>
    </div>

    <script src="../assets/js/jquery.min.js"></script>
    <script src="../assets/js/bootstrap.bundle.min.js"></script>
    <script>
      document.getElementById('fetchUser').addEventListener('click', async function () {
        const result = document.getElementById('fetchResult');
        result.textContent = 'Loading...';

        try {
          const response = await fetch('https://jsonplaceholder.typicode.com/users/1');
          const data = await response.json();
          result.innerHTML = `<pre>${JSON.stringify(data, null, 2)}</pre>`;
        } catch (error) {
          result.textContent = 'Error fetching user.';
        }
      });

      document.getElementById('saveStorage').addEventListener('click', function () {
        const key = document.getElementById('storageKey').value;
        const value = document.getElementById('storageValue').value;
        localStorage.setItem(key, value);
        document.getElementById('storageOutput').textContent = `Saved ${key} = ${value}`;
      });

      document.getElementById('loadStorage').addEventListener('click', function () {
        const key = document.getElementById('storageKey').value;
        const value = localStorage.getItem(key);
        document.getElementById('storageOutput').textContent = value ? `Loaded ${key} = ${value}` : `No value found for ${key}`;
      });
    </script>
  </body>
</html>
